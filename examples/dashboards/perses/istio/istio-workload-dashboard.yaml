kind: Dashboard
metadata:
    name: istio-workload-dashboard
    createdAt: 0001-01-01T00:00:00Z
    updatedAt: 0001-01-01T00:00:00Z
    version: 0
    project: perses-dev
spec:
    display:
        name: Istio Workload Dashboard
    variables:
        - kind: ListVariable
          spec:
            display:
                name: Namespace
                hidden: false
            defaultValue: bookinfo
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: label_replace(sum by (destination_workload_namespace) (istio_requests_total{destination_workload_namespace!="unknown"}), "namespace", "$1", "destination_workload_namespace", "(.*)") or label_replace(sum by (source_workload_namespace) (istio_requests_total{source_workload_namespace!="unknown"}), "namespace", "$1", "source_workload_namespace", "(.*)") or label_replace(sum by (destination_workload_namespace) (istio_tcp_sent_bytes_total{destination_workload_namespace!="unknown"}), "namespace", "$1", "destination_workload_namespace", "(.*)") or label_replace(sum by (source_workload_namespace) (istio_tcp_sent_bytes_total{source_workload_namespace!="unknown"}), "namespace", "$1", "source_workload_namespace", "(.*)")
                    labelName: namespace
            name: namespace
        - kind: ListVariable
          spec:
            display:
                name: Workload
                hidden: false
            defaultValue: details-v1
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: label_replace(sum by (destination_workload) (istio_requests_total{destination_workload_namespace=~"$namespace",destination_workload!="unknown"}), "workload", "$1", "destination_workload", "(.*)") or label_replace(sum by (source_workload) (istio_requests_total{source_workload_namespace=~"$namespace",source_workload!="unknown"}), "workload", "$1", "source_workload", "(.*)") or label_replace(sum by (destination_workload) (istio_tcp_sent_bytes_total{destination_workload_namespace=~"$namespace",destination_workload!="unknown"}), "workload", "$1", "destination_workload", "(.*)") or label_replace(sum by (source_workload) (istio_tcp_sent_bytes_total{source_workload_namespace=~"$namespace",source_workload!="unknown"}), "workload", "$1", "source_workload", "(.*)")
                    labelName: workload
            name: workload
        - kind: ListVariable
          spec:
            display:
                name: Reporter
                hidden: false
            defaultValue: destination
            allowAllValue: false
            allowMultiple: true
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: group by (reporter) (istio_requests_total) or group by (reporter) (istio_tcp_sent_bytes_total)
                    labelName: reporter
            name: qrep
        - kind: ListVariable
          spec:
            display:
                name: Inbound Workload Namespace
                hidden: false
            defaultValue:
                - $__all
            allowAllValue: true
            allowMultiple: true
            customAllValue: .*
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: sum(istio_requests_total{reporter=~"$qrep", destination_workload=~"$workload", destination_workload_namespace=~"$namespace"}) by (source_workload_namespace) or sum(istio_tcp_sent_bytes_total{reporter=~"$qrep", destination_workload=~"$workload", destination_workload_namespace=~"$namespace"}) by (source_workload_namespace)
                    labelName: source_workload_namespace
            name: src_namespace
        - kind: ListVariable
          spec:
            display:
                name: Inbound Workload
                hidden: false
            defaultValue:
                - $__all
            allowAllValue: true
            allowMultiple: true
            customAllValue: .*
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: sum(istio_requests_total{reporter=~"$qrep", destination_workload=~"$workload", destination_workload_namespace=~"$namespace", source_workload_namespace=~"$src_namespace"}) by (source_workload) or sum(istio_tcp_sent_bytes_total{reporter=~"$qrep", destination_workload=~"$workload", destination_workload_namespace=~"$namespace", source_workload_namespace=~"$src_namespace"}) by (source_workload)
                    labelName: source_workload
            name: src_workload
        - kind: ListVariable
          spec:
            display:
                name: Destination Service
                hidden: false
            defaultValue:
                - $__all
            allowAllValue: true
            allowMultiple: true
            customAllValue: .*
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    datasource:
                        kind: PrometheusDatasource
                        name: prometheus-datasource
                    expr: sum(istio_requests_total{reporter="source", source_workload=~"$workload", source_workload_namespace=~"$namespace"}) by (destination_service) or sum(istio_tcp_sent_bytes_total{reporter="source", source_workload=~"$workload", source_workload_namespace=~"$namespace"}) by (destination_service)
                    labelName: destination_service
            name: dstsvc
    panels:
        "0_0":
            kind: Panel
            spec:
                display:
                    name: WORKLOAD
                plugin:
                    kind: Markdown
                    spec:
                        text: |-
                            <div class="dashboard-header text-center">
                            <span>WORKLOAD: $workload.$namespace</span>
                            </div>
        "1_0":
            kind: Panel
            spec:
                display:
                    name: Incoming Request Volume
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last
                        format:
                            unit: ops/sec
                        thresholds:
                            mode: absolute
                            defaultColor: green
                            steps:
                                - value: 0
                                  color: green
                                - value: 80
                                  color: red
                        sparkline:
                            width: 1
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |-
                                    round(
                                      sum(
                                        irate(
                                          istio_requests_total{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[5m]
                                        )
                                      ),
                                      0.001
                                    )
        "1_1":
            kind: Panel
            spec:
                display:
                    name: Incoming Success Rate (non-5xx responses)
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last
                        format:
                            unit: percent-decimal
                        thresholds:
                            mode: absolute
                            defaultColor: dark-red
                            steps:
                                - value: 0
                                  color: dark-red
                                - value: 0.95
                                  color: dark-yellow
                                - value: 0.99
                                  color: dark-green
                        sparkline:
                            width: 1
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                          sum(
                                            rate(
                                              istio_requests_total{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",response_code!~"5.*"}[5m]
                                            )
                                          )
                                        /
                                          sum(
                                            rate(
                                              istio_requests_total{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[5m]
                                            )
                                          )
                                      >=
                                        0
                                    or on ()
                                      vector(1)
        "2_0":
            kind: Panel
            spec:
                display:
                    name: Request Duration
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                            mode: list
                            size: medium
                        yAxis:
                            format:
                                unit: seconds
                        visual:
                            display: line
                            lineWidth: 1
                            areaOpacity: 0.1
                            palette:
                                mode: auto
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.5,
                                          sum by (le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.5,
                                        sum by (le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: P50
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.9,
                                          sum by (le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.9,
                                        sum by (le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: P90
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.99,
                                          sum by (le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.99,
                                        sum by (le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: P99
        "3_0":
            kind: Panel
            spec:
                display:
                    name: TCP Server Traffic
                plugin:
                    kind: StatChart
                    spec:
                        calculation: mean
                        format:
                            unit: bytes/sec
                        thresholds:
                            mode: absolute
                            defaultColor: green
                            steps:
                                - value: 0
                                  color: green
                                - value: 80
                                  color: red
                        sparkline:
                            width: 1
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                      sum(
                                        irate(
                                          istio_tcp_sent_bytes_total{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                        )
                                      )
                                    +
                                      sum(
                                        irate(
                                          istio_tcp_received_bytes_total{destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep"}[1m]
                                        )
                                      )
        "3_1":
            kind: Panel
            spec:
                display:
                    name: TCP Client Traffic
                plugin:
                    kind: StatChart
                    spec:
                        calculation: mean
                        format:
                            unit: bytes/sec
                        thresholds:
                            mode: absolute
                            defaultColor: green
                            steps:
                                - value: 0
                                  color: green
                                - value: 80
                                  color: red
                        sparkline:
                            width: 1
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                      sum(
                                        irate(
                                          istio_tcp_sent_bytes_total{reporter="source",source_workload=~"$workload",source_workload_namespace=~"$namespace"}[1m]
                                        )
                                      )
                                    +
                                      sum(
                                        irate(
                                          istio_tcp_received_bytes_total{reporter="source",source_workload=~"$workload",source_workload_namespace=~"$namespace"}[1m]
                                        )
                                      )
        "4_0":
            kind: Panel
            spec:
                display:
                    name: INBOUND WORKLOADS
                plugin:
                    kind: Markdown
                    spec:
                        text: |-
                            <div class="dashboard-header text-center">
                            <span>INBOUND WORKLOADS</span>
                            </div>
        "5_0":
            kind: Panel
            spec:
                display:
                    name: Incoming Requests By Source And Response Code
                    description: Request volume to workload by source
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                            mode: list
                            size: medium
                        yAxis:
                            format:
                                unit: requests/sec
                        visual:
                            display: line
                            lineWidth: 0.25
                            areaOpacity: 0.5
                            palette:
                                mode: auto
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |-
                                    round(
                                      sum by (source_workload, source_workload_namespace, response_code) (
                                        irate(
                                          istio_requests_total{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                        )
                                      ),
                                      0.001
                                    )
                                seriesNameFormat: "{{ source_workload }}.{{ source_workload_namespace }} : {{ response_code }} (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |-
                                    round(
                                      sum by (source_workload, source_workload_namespace, response_code) (
                                        irate(
                                          istio_requests_total{connection_security_policy!="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                        )
                                      ),
                                      0.001
                                    )
                                seriesNameFormat: '{{ source_workload }}.{{ source_workload_namespace }} : {{ response_code }}'
        "5_1":
            kind: Panel
            spec:
                display:
                    name: Incoming Success Rate (non-5xx responses) By Source
                    description: Success rate of requests to workload by source
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                            mode: list
                            size: medium
                        yAxis:
                            format:
                                unit: percent
                            max: 1
                        visual:
                            display: line
                            lineWidth: 0.25
                            areaOpacity: 0.5
                            palette:
                                mode: auto
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                      sum by (source_workload, source_workload_namespace) (
                                        irate(
                                          istio_requests_total{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",response_code!~"5.*",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[5m]
                                        )
                                      )
                                    /
                                      sum by (source_workload, source_workload_namespace) (
                                        irate(
                                          istio_requests_total{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[5m]
                                        )
                                      )
                                seriesNameFormat: "{{ source_workload }}.{{ source_workload_namespace }} (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                      sum by (source_workload, source_workload_namespace) (
                                        irate(
                                          istio_requests_total{connection_security_policy!="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",response_code!~"5.*",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[5m]
                                        )
                                      )
                                    /
                                      sum by (source_workload, source_workload_namespace) (
                                        irate(
                                          istio_requests_total{connection_security_policy!="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[5m]
                                        )
                                      )
                                seriesNameFormat: '{{ source_workload }}.{{ source_workload_namespace }}'
        "6_0":
            kind: Panel
            spec:
                display:
                    name: Incoming Request Duration By Source
                    description: Request duration percentiles for workload
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                            mode: list
                            size: medium
                        yAxis:
                            format:
                                unit: milliseconds
                        visual:
                            display: line
                            lineWidth: 0.25
                            areaOpacity: 0.5
                            palette:
                                mode: auto
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.5,
                                          sum by (source_workload, source_workload_namespace, le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.5,
                                        sum by (source_workload, source_workload_namespace, le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}} P50 (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.9,
                                          sum by (source_workload, source_workload_namespace, le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.9,
                                        sum by (source_workload, source_workload_namespace, le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}} P90 (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.95,
                                          sum by (source_workload, source_workload_namespace, le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.95,
                                        sum by (source_workload, source_workload_namespace, le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}} P95 (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.99,
                                          sum by (source_workload, source_workload_namespace, le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.99,
                                        sum by (source_workload, source_workload_namespace, le) (
                                          irate(
                                            istio_request_duration_seconds_bucket{connection_security_policy="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                          )
                                        )
                                      )
                                seriesNameFormat: "{{source_workload}}.{{source_workload_namespace}} P99 (\U0001F510mTLS)"
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                datasource:
                                    kind: PrometheusDatasource
                                    name: prometheus-datasource
                                query: |4-
                                        histogram_quantile(
                                          0.5,
                                          sum by (source_workload, source_workload_namespace, le) (
                                            irate(
                                              istio_request_duration_milliseconds_bucket{connection_security_policy!="mutual_tls",destination_workload=~"$workload",destination_workload_namespace=~"$namespace",reporter=~"$qrep",source_workload=~"$src_workload",source_workload_namespace=~"$src_namespace"}[1m]
                                            )
                                          )
                                        )
                                      /
                                        1000
                                    or
                                      histogram_quantile(
                                        0.5,
                                        sum by (source_workload, source_workload_namespace, le) (
                                          irate(
