version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "**/*"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    ignore:
      # mdox >= v0.10.0 pulls gobwas/glob v1 and tablewriter v1, which break
      # golangci-lint when built from the shared scripts/go.mod.
      - dependency-name: "github.com/bwplotka/mdox"
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
