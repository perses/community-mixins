name: e2e

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  dashboard-e2e:
    runs-on: ubuntu-latest
    name: Dashboard e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.kind-version }}
          node_image: ${{ env.kind-node-image }}
          config: test/e2e/kind/config.yml
          cluster_name: community-mixins-e2e
          wait: 300s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.helm-version }}

      - name: Install percli
        uses: perses/cli-actions/actions/install_percli@e1420dc776f79f624c7d570cccc0dcdddf0d104d # v0.2.1
        with:
          cli-version: "v${{ env.perses-version }}"

      - name: Install e2e stack
        run: make e2e-install

      - name: Run operator e2e tests
        run: make test-e2e-operator

      - name: Run Perses-format e2e tests
        run: make test-e2e-perses

      - name: Debug cluster state on failure
        if: failure()
        run: |
          kubectl get perses,persesdashboards -A
          kubectl get pods,svc,endpoints -n perses-dev
          kubectl describe pods -n perses-dev
          kubectl get events -n perses-dev --sort-by=.lastTimestamp | tail -n 50
          kubectl port-forward -n perses-dev svc/perses 8080:8080 >/tmp/perses-debug-pf.log 2>&1 &
          sleep 3
          curl -sS http://127.0.0.1:8080/api/v1/projects/community-mixins/dashboards || true
