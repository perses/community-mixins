name: checks
on:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  check-golang:
    runs-on: ubuntu-latest
    name: Golang Linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: true

      - name: Tidy Go modules, format, generate docs, dashboards and check for changes
        run: make generate

      - name: Run GolangCI Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          args: --timeout 10m0s

  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: true

      - name: Run unit tests
        run: make unit-test

  check-dashboards:
    runs-on: ubuntu-latest
    name: Dashboards Linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Build dashboards
        run: make build-dashboards-local

      - name: Install percli
        uses: perses/cli-actions/actions/install_percli@e1420dc776f79f624c7d570cccc0dcdddf0d104d # v0.2.1
        with:
          cli-version: "latest"

      - name: Validate Resources with Perses CLI
        uses: perses/cli-actions/actions/validate_resources@24cfc5b42c0f1e813bf6481e4804339e646c196c # main
        with:
          directory: './built/dashboards/perses'

  format:
    runs-on: ubuntu-latest
    name: Documentation Formatting Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true

      - name: Tidy Go modules
        run: make tidy

      - name: Check Documentation
        run: make check-docs
  checklicense:
    name: "check license headers"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
      - name: check license headers
        run: make checklicense
